name: Update photos.json
on:
  push:
    branches: [main]
    paths: ['photos/**']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  manifest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build manifest
        run: |
          python3 make-manifest.py
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add photos.json
          git diff --cached --quiet || (git commit -m "Update photos.json" && git push)
