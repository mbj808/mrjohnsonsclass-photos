<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Class Photos · Mr. Johnson's Class</title>
<style>
@font-face{font-family:'Bungee';src:url(assets/bungee-400.woff2) format('woff2');font-display:swap}
@font-face{font-family:'Nunito';font-weight:400;src:url(assets/nunito-400.woff2) format('woff2');font-display:swap}
@font-face{font-family:'Nunito';font-weight:700;src:url(assets/nunito-700.woff2) format('woff2');font-display:swap}
:root{--lava1:#ff3d00;--lava2:#ff9100;--lava3:#ffd54f;--text:#f6ece4;--muted:#c9b4a6}
*{box-sizing:border-box;margin:0;padding:0}
body{background:#000;color:var(--text);font-family:'Nunito',system-ui,sans-serif;line-height:1.6;min-height:100vh}
nav{display:flex;justify-content:center;padding:.7rem 1rem;background:rgba(14,10,9,.92);border-bottom:1px solid #ff6d0033}
nav a{color:var(--muted);text-decoration:none;font-weight:700}nav a:hover{color:var(--lava2)}
h1{font-family:'Bungee',Impact,sans-serif;font-weight:400;text-align:center;font-size:clamp(2.2rem,7vw,4.5rem);color:var(--lava2);text-shadow:0 0 16px rgba(255,90,0,.5);margin:2.5rem 1rem 2rem}
main{max-width:1200px;margin:0 auto;padding:0 1rem 3rem}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:1rem}
.grid button{border:1px solid #ff6d0040;border-radius:14px;overflow:hidden;background:#111;cursor:zoom-in;padding:0;aspect-ratio:1}
.grid img{width:100%;height:100%;object-fit:cover;display:block;opacity:0;transition:opacity .4s}
.grid img.loaded{opacity:1}
.empty{text-align:center;color:var(--muted);border:1px dashed #ff9100aa;border-radius:14px;padding:3rem 1rem;background:#ff6d0010}
.empty strong{color:var(--lava3);font-size:1.3rem;display:block;margin-bottom:.4rem}
#lb{position:fixed;inset:0;background:rgba(0,0,0,.92);display:flex;align-items:center;justify-content:center;opacity:0;pointer-events:none;transition:opacity .25s;cursor:zoom-out;padding:2rem}
#lb.open{opacity:1;pointer-events:auto}
#lb img{max-width:100%;max-height:100%;border-radius:8px}
footer{text-align:center;padding:2rem 1rem;color:var(--muted);border-top:1px solid #ff6d0033}
footer a,a{color:var(--lava3)}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style></head>
<body>
<nav><a href="https://mrjohnsonsclass.org">&larr; Back to class site</a></nav>
<h1>Class Photos</h1>
<main><div id="grid" class="grid"></div></main>
<div id="lb" role="dialog" aria-modal="true" aria-label="Enlarged photo"><img alt=""></div>
<footer><a href="https://mrjohnsonsclass.org">Back to class site</a></footer>
<script>
const grid=document.getElementById('grid'),lb=document.getElementById('lb'),lbImg=lb.querySelector('img');
function empty(){grid.outerHTML='<div class="empty"><strong>No photos yet!</strong>Check back soon — class photos are on their way. 📸</div>'}
// ===== CONFIG: paste your Apps Script web app URL between the quotes =====
const DRIVE_SCRIPT_URL='https://script.google.com/macros/s/AKfycbxjIJZRYLJlmyWQ14q3kB5jtviehHUP-P_Np3nUypmMjyt1YzgNwzb12CtAmBlgk2PC5Q/exec';
// =========================================================================
function show(srcs){
  if(!srcs.length)return empty();
  srcs.forEach(({thumb,full})=>{
    const b=document.createElement('button');b.type='button';b.setAttribute('aria-label','Enlarge photo');
    const i=new Image();i.loading='lazy';i.alt='';i.referrerPolicy='no-referrer';i.src=thumb;i.onload=()=>i.classList.add('loaded');
    b.appendChild(i);b.onclick=()=>{lbImg.src=full;lb.classList.add('open')};grid.appendChild(b)});
}
function fromJson(){
  return fetch('photos.json',{cache:'no-store'}).then(r=>r.json()).then(list=>{
    if(!Array.isArray(list))list=[];
    show(list.map(p=>{const s='photos/'+encodeURIComponent(typeof p==='string'?p:p.file);return{thumb:s,full:s}}));
  }).catch(empty);
}
function fromDrive(){
  return fetch(DRIVE_SCRIPT_URL,{cache:'no-store'}).then(r=>r.json()).then(list=>{
    if(!Array.isArray(list)||!list.length)throw 0;
    show(list.map(p=>({thumb:'https://lh3.googleusercontent.com/d/'+p.id+'=w800',full:'https://lh3.googleusercontent.com/d/'+p.id+'=w2000'})));
  });
}
(DRIVE_SCRIPT_URL?fromDrive().catch(fromJson):fromJson());
lb.onclick=()=>lb.classList.remove('open');
document.addEventListener('keydown',e=>{if(e.key==='Escape')lb.classList.remove('open')});
</script>
</body></html>
